  <text x="252" y="336" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="240" text-anchor="middle" fill="#f59e0b">17</text>
  <text x="256" y="332" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="240" text-anchor="middle" fill="#ffffff">17</text>

